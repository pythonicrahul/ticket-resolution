[project]
name = "ticketing-agent"
version = "0.1.0"
description = "CloudServe support system: answers from documentation when it can defend the answer, escalates with context when it cannot."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb~=1.5.9",           # vector store; built-in all-MiniLM-L6-v2 ONNX embedder (docs/decisions.md D-02)
    "langgraph~=1.2.12",         # pipeline graph (FR-01..FR-16 wiring, row 14)
    "langchain-openai~=1.6.6",   # chat model behind the FR-15 client (D-31)
    "openai~=3.19.2",            # OpenAI-compatible client for OpenRouter or Groq
    "fastapi~=0.141.1",
    "uvicorn~=0.54.0",
    "pydantic~=2.13.5",
    "scikit-learn~=1.9.1",       # calibrated intent/urgency classifier (FR-08)
    "numpy~=2.5.3",
    "python-dotenv~=1.2.3",
    "prometheus-client~=0.26.0",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "ruff~=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
